[project]
name = "policy_flow"
version = "0.1.0"
requires-python = "==3.12.0"
dependencies = [
    "torch",
    "numpy",
    "zarr>=2.16,<3",
    "opencv-python",
    "hydra-core",
    "aim>=3.29.1",
    "pystac-client>=0.9.0",
    "tqdm",
    "torchmetrics>=1.9.0",
    "matplotlib>=3.11.2",
    "torchvision>=0.29.1",
    "gym-pusht"
]

[dependency-groups]
dev = [
    "debugpy>=1.8.22",
    "git2md>=1.1.7",
    "pre-commit",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_flow"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
